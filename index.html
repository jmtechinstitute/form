<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Form</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&family=Russo+One&family=Teko:wght@300..700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="contact-container">
        <form action="https://api.web3forms.com/submit" method="POST" class="contact-left">
            <div class="contact-left-title">
                <h2>Booking Form</h2>
                <hr>
            </div>
            <input type="hidden" name="access_key" value="23956cc6-8ff4-4ccf-a860-eaf0be305bf6">
            <input type="text" name="Patient Name " placeholder="Enter Your Name" class="conatct-inputs" required>
            <input type="email" name="Patient email" placeholder="Enter Email " class="conatct-inputs" required>
            <input type="number" name="Patient Phone" placeholder="Enter Phone" class="conatct-inputs" required>
            <input type="text" name="Appointment Time" placeholder="Appointment Time" class="conatct-inputs" required>
            <input type="text" name="Appointment Date" placeholder="Appointment Date" class="conatct-inputs" required>
            <button type="submit">BOOK NOW<img src="assets/arrow_icon.png"></button>
        </form>
    
    </div>

</body>

</html>
